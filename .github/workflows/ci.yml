# Verifica tipos y compilación en cada push y en cada pull request
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - name: Verificar tipos
        run: npx tsc --noEmit
      - name: Compilar
        run: npm run build
        env:
          VITE_API_URL: https://espacia-backend.onrender.com
      - name: Revisar la página compilada
        run: |
          # La vista previa al compartir y la política de seguridad deben quedar en el HTML
          head -c 4000 dist/index.html; echo
          revisar() { grep -qF -- "$1" dist/index.html || { echo "Falta en dist/index.html: $1"; exit 1; }; }
          revisar 'og:image'
          revisar 'https://espacia.onrender.com/vista-previa.jpg'
          revisar 'summary_large_image'
          revisar 'Content-Security-Policy'
          revisar 'https://espacia-backend.onrender.com'
          test -f dist/vista-previa.jpg
